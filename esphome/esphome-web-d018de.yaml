esphome:
  name: esphome-web-d018de
  friendly_name: Hamsterrad
  name_add_mac_suffix: false

esp8266:
  board: d1_mini

# Enable logging
logger:

# Enable Home Assistant API
api:
  encryption:
    key: !secret esphome_web_d027a9__encryption_key

# Allow Over-The-Air updates
ota:
  - platform: esphome
    password: !secret esphome_web_d018de__ota_password

# Allow provisioning Wi-Fi via serial
improv_serial:

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # Set up a wifi access point as a fallback
  ap: {}

# In combination with the `ap` this allows the user
# to provision wifi credentials to the device via WiFi AP.
captive_portal:

# To have a "next url" for improv serial
web_server:

# -----------------------------------------------------------
# ZEITSTEUERUNG (Täglicher Reset um 08:00 Uhr)
# -----------------------------------------------------------
time:
  - platform: sntp
    id: sntp_time
    timezone: Europe/Berlin
    on_time:
      - seconds: 0
        minutes: 0
        hours: 8
        then:
          - lambda: |-
              id(pulses_today) = 0;
              id(max_rpm_today) = 0.0;
              id(sensor_distance_today).publish_state(0.0);
              id(sensor_max_speed_today).publish_state(0.0);
              ESP_LOGD("custom", "Statistiken genullt.");

# -----------------------------------------------------------
# INTERNE SPEICHERVARIABLEN (Reboot-sicher)
# -----------------------------------------------------------
globals:
  - id: pulses_today
    type: int
    restore_value: yes
    initial_value: '0'
  - id: pulses_total
    type: int
    restore_value: yes
    initial_value: '0'
  - id: max_rpm_today
    type: float
    restore_value: yes
    initial_value: '0.0'
  - id: last_pulse_time
    type: uint32_t
    restore_value: no
    initial_value: '0'

# -----------------------------------------------------------
# RADDURCHMESSER EINGABE (Home Assistant UI)
# -----------------------------------------------------------
number:
  - platform: template
    name: "Rad Durchmesser"
    id: wheel_diameter
    icon: "mdi:diameter"
    min_value: 10.0
    max_value: 50.0
    step: 0.1
    unit_of_measurement: "cm"
    mode: box
    optimistic: true
    restore_value: true
    initial_value: 28.0
    on_value:
      then:
        - lambda: |-
            // Wenn der Durchmesser in HA geändert wird, berechnen wir die gefahrenen KM neu
            float d = x;
            id(sensor_distance_total).publish_state(id(pulses_total) * d * 3.14159265 * 0.00001);
            id(sensor_distance_today).publish_state(id(pulses_today) * d * 3.14159265 * 0.00001);
            id(sensor_max_speed_today).publish_state(id(max_rpm_today) * d * 3.14159265 * 0.0006);

# -----------------------------------------------------------
# AUTO-ZERO TIMER (Setzt km/h auf 0, wenn Hamster stoppt)
# -----------------------------------------------------------
interval:
  - interval: 2s
    then:
      - lambda: |-
          // Wenn der letzte Strich länger als 2 Sekunden (2000ms) her ist...
          if (millis() - id(last_pulse_time) > 2000) {
            // ...und die aktuelle Anzeige nicht schon 0 ist, dann setze sie auf 0.
            if (id(sensor_speed).state != 0.0) {
              id(sensor_speed).publish_state(0.0);
            }
          }

# -----------------------------------------------------------
# DER OPTISCHE SENSOR (Mit Cooldown & Entprellung)
# -----------------------------------------------------------
binary_sensor:
  - platform: gpio
    pin: 
      # D2 auf deinem AZDelivery D1 Mini entspricht GPIO4. 
      # Sehr sicherer Pin für solche Sensoren!
      number: GPIO4
      mode:
        input: true
        pullup: true
    id: optical_sensor
    internal: true
    filters:
      # Verhindert rein elektrisches Flimmern, wenn die Linie genau auf dem Sensor ruht.
      # Das Signal muss mindestens 5ms lang stabil sein.
      - delayed_on: 5ms
      - delayed_off: 5ms
      
    on_press:
      then:
        - lambda: |-
            uint32_t now = millis();
            uint32_t diff = now - id(last_pulse_time);
            
            // --------------------------------------------------------
            // DER COOLDOWN (Verhindert Zählen beim schnellen Pendeln)
            // Alles unter 250 Millisekunden wird konsequent ignoriert.
            // 250ms entsprechen 4 Umdrehungen pro Sekunde (sehr schnell).
            // --------------------------------------------------------
            if (diff > 250) {
              id(last_pulse_time) = now;
              
              // 1. Zähler erhöhen
              id(pulses_today) += 1;
              id(pulses_total) += 1;
              
              // 2. Geschwindigkeit berechnen
              float rpm = 60000.0 / diff; 
              
              if (rpm > id(max_rpm_today)) {
                id(max_rpm_today) = rpm;
              }
              
              float d = id(wheel_diameter).state;
              
              // Werte an Home Assistant senden
              id(sensor_speed).publish_state(rpm * d * 3.14159265 * 0.0006);
              id(sensor_max_speed_today).publish_state(id(max_rpm_today) * d * 3.14159265 * 0.0006);
              id(sensor_distance_total).publish_state(id(pulses_total) * d * 3.14159265 * 0.00001);
              id(sensor_distance_today).publish_state(id(pulses_today) * d * 3.14159265 * 0.00001);
              id(sensor_pulses_total).publish_state(id(pulses_total));
            }

# -----------------------------------------------------------
# DIE VIRTUELLEN SENSOREN FÜR HOME ASSISTANT
# -----------------------------------------------------------
sensor:
  - platform: template
    name: "Hamsterrad Geschwindigkeit"
    id: sensor_speed
    unit_of_measurement: "km/h"
    icon: "mdi:speedometer"
    accuracy_decimals: 2

  - platform: template
    name: "Hamsterrad Maximalgeschwindigkeit Heute"
    id: sensor_max_speed_today
    unit_of_measurement: "km/h"
    icon: "mdi:speedometer-maximal"
    accuracy_decimals: 2

  - platform: template
    name: "Hamsterrad Strecke Gesamt"
    id: sensor_distance_total
    unit_of_measurement: "km"
    icon: "mdi:map-marker-distance"
    accuracy_decimals: 3

  - platform: template
    name: "Hamsterrad Strecke Heute"
    id: sensor_distance_today
    unit_of_measurement: "km"
    icon: "mdi:walk"
    accuracy_decimals: 3

  - platform: template
    name: "Hamsterrad Umdrehungen Gesamt"
    id: sensor_pulses_total
    icon: "mdi:counter"
    unit_of_measurement: "Umdr."
    accuracy_decimals: 0
    state_class: total_increasing