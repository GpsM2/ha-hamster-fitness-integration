# ============================================================================
# Hamster Fitness - einfaches Dashboard nur mit Standard-Lovelace-Karten
# ============================================================================
# Im Gegensatz zu dashboard_taco.yaml werden hier AUSSCHLIESSLICH in Home
# Assistant eingebaute Karten verwendet (entities/glance/gauge/
# statistics-graph) - keine HACS-Zusatzkarten (Mushroom, ApexCharts) nötig.
#
# Und im Gegensatz zu einer früheren Version dieser Datei brauchst du hier
# AUSSCHLIESSLICH Entities dieses einen Hamster-Geräts - Käfigtür,
# Feuchtigkeit und Geschwindigkeit laufen jetzt mit über die Integration
# (sofern beim Einrichten ein Feuchtigkeits-/Geschwindigkeitssensor
# ausgewählt wurde), du musst also nicht mehr zusätzlich die rohen
# ESPHome-/Tür-Sensor-Entity-IDs heraussuchen.
#
# Einfach in ein neues Dashboard/eine neue Ansicht einfügen und die
# Entity-IDs unten an deinen tatsächlichen Hamster-Namen anpassen (hier
# beispielhaft "Taco").
#
# Die statistics-graph-Karte braucht Long-Term-Statistics für
# sensor.hamster_taco_daily_distance - die zeichnet der Home-Assistant-Recorder für
# jeden Sensor mit state_class total_increasing automatisch mit, ganz ohne
# Zusatzeinrichtung.
# ============================================================================

views:
  - title: Taco
    path: taco-einfach
    icon: mdi:rodent
    cards:
      - type: glance
        title: Taco
        entities:
          - entity: sensor.hamster_taco_health_score
            name: Health Score
          - entity: binary_sensor.hamster_taco_warning
            name: Warnung
          - entity: binary_sensor.hamster_taco_door
            name: Käfigtür
          - entity: sensor.hamster_taco_daily_distance
            name: Heute gelaufen

      - type: gauge
        entity: sensor.hamster_taco_health_score
        name: Health Score
        min: 0
        max: 100
        severity:
          red: 0
          yellow: 50
          green: 75

      # Nur sinnvoll, wenn beim Einrichten ein Geschwindigkeitssensor
      # ausgewählt wurde - sonst diese Karte einfach entfernen.
      - type: gauge
        entity: sensor.hamster_taco_current_speed
        name: Geschwindigkeit
        min: 0
        max: 5
        severity:
          green: 0
          yellow: 3
          red: 4

      - type: statistics-graph
        title: Laufstrecke (letzte 7 Tage)
        chart_type: bar
        period: day
        days_to_show: 7
        stat_types:
          - change
        entities:
          - sensor.hamster_taco_daily_distance

      - type: entities
        title: Laufen
        entities:
          - entity: sensor.hamster_taco_daily_distance
          - entity: sensor.hamster_taco_night_distance
          - entity: sensor.hamster_taco_lifetime_distance
          - entity: sensor.hamster_taco_max_speed_tonight

      - type: entities
        title: Käfig & Gesundheit
        entities:
          - entity: binary_sensor.hamster_taco_door
          - type: attribute
            entity: binary_sensor.hamster_taco_door
            attribute: hours_closed
            name: Seit (Stunden geschlossen)
          - type: attribute
            entity: sensor.hamster_taco_health_score
            attribute: temperature
            name: Temperatur
            suffix: " °C"
          - entity: sensor.hamster_taco_humidity
          - entity: number.hamster_taco_weight
          - entity: date.hamster_taco_departure_date
          - entity: binary_sensor.hamster_taco_warning
