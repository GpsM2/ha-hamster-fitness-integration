name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements_test.txt

      - name: Install test/dev dependencies
        run: pip install -r requirements_test.txt

      - name: ruff check
        run: ruff check custom_components tests

      - name: mypy
        # pytest-homeassistant-custom-component still pins an older Home
        # Assistant release than manifest.json requires, which produces
        # exactly one known mypy error (OptionsFlowWithReload -
        # documented in CLAUDE.md). That goes away by itself once the
        # test library catches up; it is not something to work around in
        # production code. So this step tolerates *that one line* and
        # nothing else - any other mypy error still fails the build.
        run: |
          set +e
          mypy custom_components/hamster_fitness > mypy.log 2>&1
          status=$?
          cat mypy.log
          if [ "$status" -eq 0 ]; then
            exit 0
          fi
          unexpected=$(grep "error:" mypy.log | grep -v "OptionsFlowWithReload")
          if [ -n "$unexpected" ]; then
            echo "::error::Unexpected mypy errors (beyond the documented OptionsFlowWithReload one):"
            echo "$unexpected"
            exit 1
          fi
          echo "Only the documented OptionsFlowWithReload error - OK."

      - name: pytest
        run: pytest tests/ -q

  hacs:
    # Catches hacs.json/manifest.json mistakes here instead of at
    # submission time. HACS reads repository metadata over the API, so
    # this job needs the repository to be public and to have a
    # description set - both are true.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: HACS validation
        uses: hacs/action@main
        with:
          category: integration
          # The "brands" check verifies that the domain is listed in
          # home-assistant/brands. That submission is a separate PR
          # against a repository we do not control, and it is still
          # pending - see issue #87. Drop this line once it is merged,
          # so the check starts guarding us instead of being skipped.
          ignore: brands

  frontend-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Check every card loads as a valid ES module
        run: python tools/check_frontend_syntax.py
