name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements_test.txt

      - name: Install test/dev dependencies
        run: pip install -r requirements_test.txt

      - name: ruff check
        run: ruff check custom_components tests

      - name: mypy
        run: mypy custom_components/hamster_fitness

      - name: pytest
        run: pytest tests/ -q

  hacs:
    # Catches hacs.json/manifest.json mistakes here instead of at
    # submission time. HACS reads repository metadata over the API, so
    # this job needs the repository to be public and to have a
    # description set - both are true.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: HACS validation
        uses: hacs/action@main
        with:
          category: integration

  hassfest:
    # The same manifest/translation validation core integrations get.
    # The catalog requires it alongside the HACS action.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: hassfest
        uses: home-assistant/actions/hassfest@master

  frontend-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Playwright
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Check every card loads as a valid ES module and escapes user text
        run: python tools/check_frontend_syntax.py
