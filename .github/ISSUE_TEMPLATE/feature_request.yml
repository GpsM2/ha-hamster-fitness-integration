name: Feature request
description: Suggest a new metric, card feature, or health-score improvement.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea! Please describe it below - concrete examples
        help a lot.

  - type: dropdown
    id: area
    attributes:
      label: What does this relate to?
      options:
        - New metric / sensor
        - Lovelace card (hamster-fitness-card / ranking card)
        - Health score algorithm
        - ESPHome firmware
        - Something else
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What would you like to see?
      description: Describe the feature or change you're requesting.
    validations:
      required: true

  - type: textarea
    id: motivation
    attributes:
      label: Why is this useful?
      description: What problem does this solve, or what does it make easier?
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives or workarounds you've tried
    validations:
      required: false
