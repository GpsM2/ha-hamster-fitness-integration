# Config for github/issue-labeler (see .github/workflows/issue-labeler.yml).
#
# Each label maps to a list of regex patterns. IMPORTANT: if a label has
# several array entries, ALL of them must match for the label to be
# applied (AND, not OR) - that's why each label below uses a single
# slash-delimited /pattern/flags regex with alternation (|) instead, which
# gives OR semantics for the keywords. The trailing "i" flag makes matching
# case-insensitive. Keywords are kept bilingual (EN/DE) since issues may
# come in either language.
#
# The action only ADDS labels, it never removes them - so an issue whose
# text sounds like both a bug report and a feature request can end up with
# both. That is deliberate: a human glance is cheaper than a missed label.
#
# Matching runs against the issue TITLE ONLY (include-body: 0 in the
# workflow). Everything below is therefore written for a one-line summary,
# not for prose - patterns may be a little broad, because a title that
# says "distance" really is about distance, whereas a body says it in
# passing all the time.
#
# The generic word "sensor" (DE and EN) is deliberately left out of
# "hardware" - it also appears constantly in normal integration reports
# ("temperature sensor won't select", "door sensor unavailable") and would
# over-match. TCRT5000/ESPHome/wiring terms already identify hardware
# reports specifically enough.
#
# There is deliberately NO `integration` rule any more. This is the
# integration repo, so the label carried no information here - it matched
# nearly everything - and genuine hardware reports are transferred to
# hamster-fitness-hardware automatically anyway. The label itself is kept
# in the repo so the historical issues that already carry it stay intact.
#
# ---------------------------------------------------------------------
# ADDING A NEW LOVELACE CARD? Three things have to happen together:
#   1. create a `card: <name>` label in the repo
#      (gh label create "card: <name>" --color ... --description ...)
#   2. add a `card: <name>:` block below, matching its custom element
#      name, its JS filename, and whatever people would plausibly call it
#      in prose - in both English and German
#   3. list it in docs/cards/ and the README table
# Otherwise issues about that card land unlabelled and get lost.
# ---------------------------------------------------------------------

# --- Issue type -------------------------------------------------------
# Deliberately keyed on words that describe something being WRONG or
# WANTED, not on generic vocabulary. "add"/"neu" are left out of
# `enhancement` on purpose: they appear in nearly every bug report too
# ("after adding the sensor..."), and a wrong label is worse than none.

bug:
  - '/\bbug\b|\bfehler\b|\berror\b|crash|absturz|abgestürzt|exception|traceback|stack ?trace|funktioniert nicht|geht nicht|klappt nicht|does(n.t| not) work|not working|broken|kaputt|defekt|schlägt fehl|fails?\b|failing|unexpected|unerwartet|verschwind(et|en)|disappears?|hängt sich auf|freezes?|eingefroren|reproduc(e|ible)|reproduzier/i'

enhancement:
  - '/feature[ -]?request|enhancement|verbesserung(svorschlag)?|feature\b|w(ä|ae)re (sch(ö|oe)n|gut|super|toll|praktisch)|would be (nice|great|good)|k(ö|oe)nnte man|vorschlag|proposal|idee\b|\bidea\b|wunsch\b|support for|unterst(ü|ue)tzung f(ü|ue)r|nice to have/i'

documentation:
  - '/documentation|dokumentation|\bdocs?\b|\bdoku\b|readme|anleitung|tutorial|\bguide\b|typo|tippfehler|rechtschreib|wiki|beschreibung fehlt|missing description/i'

# --- Subject area -----------------------------------------------------

hardware:
  - '/esphome|d1[ -]?mini|esp8266|esp32|tcrt5000|wiring|verkabelung|soldering|löten|photo ?sensor|opto ?sensor|lichtschranke/i'

# The scoring ALGORITHM, not "anything involving running". `distance`,
# `distanz`, `laufstrecke`, `umdrehung` and `rotation` used to live here
# and were the worst over-matchers in the whole config - almost every
# issue about the wheel, the Running card or a chip value mentions a
# distance without being about how the score is computed.
health-score:
  - '/algorithm(us)?|health[ -]?score|gesundheit(swert)?|penalty|punktabzug|warnschwelle|warning threshold|score[ -]?berechnung|score calculation|bewertung/i'

weather:
  - '/\bweather\b|\bwetter\b|forecast|vorhersage|wettervorhersage|hitzewarn|heat ?wave|hitzewelle|\bregen\b|\brain\b|gewitter|thunderstorm|weather\.[a-z_]+/i'

# --- One label per bundled Lovelace card ------------------------------
# Matched on the custom element name, the JS filename, and the card's
# display name as a human would write it. Kept deliberately specific so a
# generic "the card is broken" report doesn't get tagged with all of them.

'card: health-score':
  - '/hamster-fitness-card|health[ -]?score[ -]?card|karte.{0,20}health[ -]?score|health[ -]?score.{0,20}(card|karte)|säulen|pillars|smart insight|trend[ -]?(chart|diagramm)|4[ -]?säulen/i'

# `\bchips?\b` used to be here and was dropped: every card has chips or
# pills of some kind, so it tagged this card for layout reports about all
# the others.
'card: day-night':
  - '/hamster-day-night-card|day ?& ?night|day[ -]?and[ -]?night|tag ?& ?nacht|laufrad[ -]?animation|wheel animation|nest[ -]?szene|schlafszene|nachthimmel|night sky|k(ä|ae)figlicht|cage light/i'

'card: ranking':
  - '/hamster-fitness-ranking-card|ranking[ -]?(card|karte)|bestenliste|rangliste|leaderboard/i'

'card: chronicle':
  - '/hamster-chronicle-card|chronicle[ -]?(card|karte)|chronik|lebenslauf[ -]?archiv|lifetime archive|history_lifedata/i'

'card: weighing':
  - '/hamster-weight-card|weigh(ing|t|[ -]?in)[ -]?(card|karte)|wiege[ -]?(karte|erinnerung)|gewichts?[ -]?(karte|eingabe)|track weight|gewicht erfassen|dial scale|zifferblatt|_weight\b/i'

# Not built yet (see the Running card issue) - the rule exists ahead of
# the card so the issues planning it are grouped from the start rather
# than being relabelled later.
'card: running':
  - '/hamster-running-card|running[ -]?(card|karte)|lauf[ -]?(karte|historie|statistik)|running (history|session)|laufsession|nacht[ -]?historie|night history|bestleistung|personal best|pers(ö|oe)nliche bestzeit/i'
